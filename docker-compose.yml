# =============================================================================
# digital-finance-ai-service 独立部署文件
# 镜像来源: SWR (华为云容器镜像服务)
# 依赖: go-backend 已就绪 (通过 external network 通信)
# =============================================================================
version: "3.8"

services:
  ai-service:
    image: swr.ap-southeast-3.myhuaweicloud.com/digital-finance-commercial/ai-service:${TAG:-latest}
    container_name: df-ai-service
    restart: unless-stopped
    ports:
      - "${AI_PORT:-16081}:8001"
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-minimax}
      MODEL_NAME: ${MODEL_NAME:-MiniMax-M3}
      API_KEY: ${API_KEY:-sk-cp-671aUzqwJvB5jrzar-wzBpyN8uy87EnXbQ3GgitRADNol9-jCIB00PqjQSptDCdWLNDfQlbFMp7z0n5l5xvF56E35JJ1ew--IQobbtWeSjtZsilPiysccvM}
      DATABASE_URL: postgres://${POSTGRES_USER:-dfuser}:${POSTGRES_PASSWORD:-dfpass123}@postgres:5432/${POSTGRES_DB:-digital_finance}?sslmode=disable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

networks:
  df-network:
    name: digital-finance-network
    external: true